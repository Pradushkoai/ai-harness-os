name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    name: ruff (E4,E7,E9,F,E501 @ 100)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: "Ruff check (repo rule: ruff-compatible, line length 100)"
        run: ruff check --select E4,E7,E9,F,E501 --line-length 100 packages/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        package:
          - name: russian-llm-pack
            smoke: "rlp --version"
          - name: bsl-verify
            smoke: "bsl-check --version"
          - name: harness-loop
            smoke: "harness-loop --version"
          - name: agents-md
            smoke: "agents-md --version"
    name: ${{ matrix.package.name }} / py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all packages (dependency order) with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/russian-llm-pack[dev]"
          pip install -e "packages/bsl-verify[dev]"
          pip install -e "packages/harness-loop[dev]"
          pip install -e "packages/agents-md[dev]"

      - name: Run unit tests (no network, no java, no keys)
        working-directory: packages/${{ matrix.package.name }}
        run: pytest -q

      - name: CLI smoke
        run: ${{ matrix.package.smoke }}

  # Windows is a first-class platform: it is the primary dev/pilot OS for
  # 1C projects. One Python version per package is enough to catch the
  # POSIX-assumption class of test bugs (path separators, java.exe lookup,
  # file:// URI construction) — the full version matrix stays on ubuntu.
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: russian-llm-pack
            smoke: "rlp --version"
          - name: bsl-verify
            smoke: "bsl-check --version"
          - name: harness-loop
            smoke: "harness-loop --version"
          - name: agents-md
            smoke: "agents-md --version"
    name: windows / ${{ matrix.package.name }} / py3.14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install all packages (dependency order) with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/russian-llm-pack[dev]"
          pip install -e "packages/bsl-verify[dev]"
          pip install -e "packages/harness-loop[dev]"
          pip install -e "packages/agents-md[dev]"

      - name: Run unit tests (no network, no java, no keys)
        working-directory: packages/${{ matrix.package.name }}
        run: pytest -q

      - name: CLI smoke
        run: ${{ matrix.package.smoke }}

  # A4 gate (roadmap 2.1): every benchmark task with L1 checks must pass
  # its own reference solution on the real OneScript engine. Pinned engine
  # version for reproducibility; ~47MB download, runs in ~90s.
  l1-gate:
    runs-on: ubuntu-latest
    name: L1 oracle gate (OneScript 2.2.0)
    timeout-minutes: 15
    env:
      ONESCRIPT_VERSION: "2.2.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages (dependency order)
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/russian-llm-pack"
          pip install -e "packages/bsl-verify"
          pip install -e "packages/harness-loop"

      - name: Install OneScript engine
        run: |
          curl -sL --retry 3             "https://github.com/EvilBeaver/OneScript/releases/download/v${ONESCRIPT_VERSION}/OneScript-${ONESCRIPT_VERSION}-linux-x64.zip"             -o /tmp/oscript.zip
          unzip -q -o /tmp/oscript.zip -d "$HOME/oscript"
          chmod +x "$HOME/oscript/bin/oscript"
          "$HOME/oscript/bin/oscript" -version || true

      - name: Run L1 integration gate
        working-directory: packages/harness-loop
        run: |
          OSCRIPT_PATH="$HOME/oscript/bin/oscript" pytest -m integration tests/test_integration_exec.py -v
