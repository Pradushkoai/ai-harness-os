name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        package:
          - name: russian-llm-pack
            smoke: "rlp --version"
          - name: bsl-verify
            smoke: "bsl-check --version"
          - name: harness-loop
            smoke: "harness-loop --version"
    name: ${{ matrix.package.name }} / py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all packages (dependency order) with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/russian-llm-pack[dev]"
          pip install -e "packages/bsl-verify[dev]"
          pip install -e "packages/harness-loop[dev]"

      - name: Run unit tests (no network, no java, no keys)
        working-directory: packages/${{ matrix.package.name }}
        run: pytest -q

      - name: CLI smoke
        run: ${{ matrix.package.smoke }}
