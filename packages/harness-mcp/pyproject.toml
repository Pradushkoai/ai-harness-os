[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-mcp"
version = "0.1.1"
description = "MCP server exposing ai-harness-os to coding agents: verify_module / run_loop / eval_summary / benchmark_info / ping over the existing ports (roadmap 2.1, phase B)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pradushkoai" }]
keywords = ["1c", "bsl", "mcp", "ai-agents", "model-context-protocol", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "harness-loop>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
harness-mcp = "harness_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not integration'"
markers = [
    "live: live LLM calls (needs a provider key) — kept for symmetry with sibling packages",
    "integration: needs java + bsl-language-server.jar / OneScript engine",
]
