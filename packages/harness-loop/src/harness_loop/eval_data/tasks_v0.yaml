  - id: proc-tp-delete-empty
    category: tablepart
    difficulty: hard
    prompt: "Напиши процедуру УдалитьПустыеСтрокиТЧ(Товары, ИмяКолонки), которая удаляет из табличной части строки, где значение указанной колонки пустое (пустая строка или только пробелы; значение приводи к строке). Обходи строки С ЗАДНЕЙ К ПЕРВОЙ по индексу — иначе индексация собьётся при удалении."
    reference: |
      Процедура УдалитьПустыеСтрокиТЧ(Товары, ИмяКолонки)
          Индекс = Товары.Количество() - 1;
          Пока Индекс >= 0 Цикл
              Строка = Товары.Получить(Индекс);
              Если СокрЛП(Строка(Строка[ИмяКолонки])) = "" Тогда
                  Товары.Удалить(Индекс);
              КонецЕсли;
              Индекс = Индекс - 1;
          КонецЦикла;
      КонецПроцедуры
    checks:
      - call: "Товары.Количество()"
        setup: "Товары = Новый ТаблицаЗначений; Товары.Колонки.Добавить(\"Количество\"); С = Товары.Добавить(); С.Количество = 0; С = Товары.Добавить(); С.Количество = 5; УдалитьПустыеСтрокиТЧ(Товары, \"Количество\")"
        expect: "2"
