  - id: func-nstr-parse
    category: nstr
    difficulty: hard
    prompt: "Напиши функцию ПереводИзНСтр(СтрокаНСтр, Язык), которая разбирает строку формата НСтр (например «ru = 'Привет'; en = 'Hello'») и возвращает значение для указанного языка без обрамляющих апострофов. Секции разделены «;», значение всегда обёрнуто в апострофы. Если языка нет — верни Неопределено."
    reference: |
      Функция ПереводИзНСтр(СтрокаНСтр, Язык)
          Части = СтрРазделить(СтрокаНСтр, ";", Ложь);
          Для Каждого Часть Из Части Цикл
              Поля = СтрРазделить(СокрЛП(Часть), "=", Ложь);
              Если Поля.Количество() <> 2 Тогда
                  Продолжить;
              КонецЕсли;
              Если СокрЛП(Поля[0]) = Язык Тогда
                  Значение = СокрЛП(Поля[1]);
                  Возврат Сред(Значение, 2, СтрДлина(Значение) - 2);
              КонецЕсли;
          КонецЦикла;
          Возврат Неопределено;
      КонецФункции
    checks:
      - call: "ПереводИзНСтр(Н, \"ru\")"
        setup: "Н = \"ru = 'Привет'; en = 'Hello'\""
        expect: "Привет"
      - call: "ПереводИзНСтр(Н, \"en\")"
        setup: "Н = \"ru = 'Привет'; en = 'Hello'\""
        expect: "Hello"
      - call: "ПереводИзНСтр(Н, \"de\")"
        setup: "Н = \"ru = 'Привет'; en = 'Hello'\""
        expect: ""

  - id: func-http-status-text
    category: http
    difficulty: easy
    prompt: "Напиши функцию ТекстСтатуса(Код), которая по числовому HTTP-коду возвращает его описание: 200 — «ОК», 201 — «Создано», 400 — «Ошибка запроса», 401 — «Не авторизован», 403 — «Запрещено», 404 — «Не найдено», 500 — «Внутренняя ошибка сервера». Для любого другого кода верни «Неизвестный код». Используй Соответствие код — текст."
    reference: |
      Функция ТекстСтатуса(Код)
          Описания = Новый Соответствие;
          Описания.Вставить(200, "ОК");
          Описания.Вставить(201, "Создано");
          Описания.Вставить(400, "Ошибка запроса");
          Описания.Вставить(401, "Не авторизован");
          Описания.Вставить(403, "Запрещено");
          Описания.Вставить(404, "Не найдено");
          Описания.Вставить(500, "Внутренняя ошибка сервера");
          Результат = Описания.Получить(Код);
          Если Результат = Неопределено Тогда
              Возврат "Неизвестный код";
          КонецЕсли;
          Возврат Результат;
      КонецФункции
    checks:
      - call: "ТекстСтатуса(200)"
        expect: "ОК"
      - call: "ТекстСтатуса(404)"
        expect: "Не найдено"
      - call: "ТекстСтатуса(999)"
        expect: "Неизвестный код"

  - id: func-http-url-parts
    category: http
    difficulty: medium
    prompt: "Напиши функцию РазобратьАдрес(URL), которая разбирает адрес вида «протокол://хост[:порт]/путь» на структуру с ключами «Протокол», «Хост», «Порт», «Путь». Если порт не указан — 80 для http и 443 для https. Если пути нет — «/»."
    reference: |
      Функция РазобратьАдрес(URL)
          Части = СтрРазделить(URL, "://", Ложь);
          Протокол = Части[0];
          Остаток = Части[1];
          ПозицияСлеша = СтрНайти(Остаток, "/");
          Если ПозицияСлеша = 0 Тогда
              ХостИПорт = Остаток;
              Путь = "/";
          Иначе
              ХостИПорт = Лев(Остаток, ПозицияСлеша - 1);
              Путь = Сред(Остаток, ПозицияСлеша);
          КонецЕсли;
          Порт = 80;
          Если Протокол = "https" Тогда
              Порт = 443;
          КонецЕсли;
          ПозицияДвоеточия = СтрНайти(ХостИПорт, ":");
          Хост = ХостИПорт;
          Если ПозицияДвоеточия > 0 Тогда
              Хост = Лев(ХостИПорт, ПозицияДвоеточия - 1);
              Порт = Число(Сред(ХостИПорт, ПозицияДвоеточия + 1));
          КонецЕсли;
          Результат = Новый Структура;
          Результат.Вставить("Протокол", Протокол);
          Результат.Вставить("Хост", Хост);
          Результат.Вставить("Порт", Порт);
          Результат.Вставить("Путь", Путь);
          Возврат Результат;
      КонецФункции
    checks:
      - call: "РазобратьАдрес(\"http://host:8080/path\").Хост"
        expect: "host"
      - call: "РазобратьАдрес(\"http://host:8080/path\").Порт"
        expect: "80"

  - id: proc-http-get
    category: http
    difficulty: medium
    prompt: "Напиши процедуру ВыполнитьGET(Хост, Порт, Путь), которая создаёт HTTPСоединение с указанными хостом и портом и таймаутом 30 секунд, выполняет GET-запрос по переданному пути и выводит код состояния ответа методом Сообщить(). Тело ответа обрабатывать не нужно."
    reference: |
      Процедура ВыполнитьGET(Хост, Порт, Путь)
          Соединение = Новый HTTPСоединение(Хост, Порт,,,, 30);
          Запрос = Новый HTTPЗапрос(Путь);
          Ответ = Соединение.Получить(Запрос);
          Сообщить(Строка(Ответ.КодСостояния));
      КонецПроцедуры
    checks:
      - call: "ВыполнитьGET(\"127.0.0.1\", ПортСервера, \"/data\")"
        expect: "200"
        proc: true
        http_stub: true
      - call: "ВыполнитьGET(\"127.0.0.1\", ПортСервера, \"/missing\")"
        expect: "404"
        proc: true
        http_stub: true

  - id: func-http-retry-get
    category: http
    difficulty: hard
    prompt: "Напиши функцию ПолучитьСПовтором(Соединение, Путь, ЧислоПопыток), которая выполняет GET-запрос по пути через переданное HTTPСоединение и возвращает тело ответа как строку. При исключении повторяй запрос, но суммарно не больше ЧислоПопыток попыток. Если провалились все попытки — вызови ВызватьИсключение с текстом «Запрос не удался»."
    reference: |
      Функция ПолучитьСПовтором(Соединение, Путь, ЧислоПопыток)
          Для НомерПопытки = 1 По ЧислоПопыток Цикл
              Попытка
                  Запрос = Новый HTTPЗапрос(Путь);
                  Ответ = Соединение.Получить(Запрос);
                  Возврат Ответ.ПолучитьТелоКакСтроку();
              Исключение
                  Если НомерПопытки = ЧислоПопыток Тогда
                      ВызватьИсключение "Запрос не удался";
                  КонецЕсли;
              КонецПопытки;
          КонецЦикла;
          Возврат "";
      КонецФункции
    checks:
      - call: "ПолучитьСПовтором(Соед, \"/data\", 3)"
        setup: "Соед = Новый HTTPСоединение(\"127.0.0.1\", ПортСервера)"
        expect: "payload-42"
        http_stub: true
      - call: "ПолучитьСПовтором(Соед, \"/flaky\", 3)"
        setup: "Соед = Новый HTTPСоединение(\"127.0.0.1\", ПортСервера)"
        expect: "recovered-ok"
        http_stub: true
      - call: "ПолучитьСПовтором(Соед, \"/missing\", 2)"
        setup: "Соед = Новый HTTPСоединение(\"127.0.0.1\", ПортСервера)"
        expect: ""
        http_stub: true

  - id: func-skd-set-parameter
    category: skd
    difficulty: medium
    prompt: "Напиши функцию УстановитьПараметрКомпоновки(Настройки, ИмяПараметра, Значение), которая ищет в настройках компоновки данных параметр по имени (через ПараметрКомпоновкиДанных) и, если найден, задаёт ему значение и включает использование, после чего возвращает Истина. Если параметра с таким именем нет — верни Ложь, ничего не меняя."
    reference: |
      Функция УстановитьПараметрКомпоновки(Настройки, ИмяПараметра, Значение)
          ПараметрКомпоновки = Новый ПараметрКомпоновкиДанных(ИмяПараметра);
          Параметр = Настройки.ПараметрыДанных.НайтиЗначениеПараметра(ПараметрКомпоновки);
          Если Параметр = Неопределено Тогда
              Возврат Ложь;
          КонецЕсли;
          Параметр.Значение = Значение;
          Параметр.Использование = Истина;
          Возврат Истина;
      КонецФункции

  - id: func-skd-add-filter
    category: skd
    difficulty: medium
    prompt: "Напиши функцию ДобавитьОтборКомпоновки(Настройки, ИмяПоля, Значение, ВидСравнения), которая добавляет в отбор настроек компоновки данных новый элемент типа «ЭлементОтбораКомпоновкиДанных»: левое значение — новое поле компоновки по имени, правое — переданное значение, вид сравнения — из параметра, использование включено. Функция возвращает добавленный элемент отбора."
    reference: |
      Функция ДобавитьОтборКомпоновки(Настройки, ИмяПоля, Значение, ВидСравнения)
          ЭлементОтбора = Настройки.Отбор.Элементы.Добавить(Тип("ЭлементОтбораКомпоновкиДанных"));
          ЭлементОтбора.ЛевоеЗначение = Новый ПолеКомпоновкиДанных(ИмяПоля);
          ЭлементОтбора.ПравоеЗначение = Значение;
          ЭлементОтбора.ВидСравнения = ВидСравнения;
          ЭлементОтбора.Использование = Истина;
          Возврат ЭлементОтбора;
      КонецФункции

  - id: func-skd-composite-table
    category: skd
    difficulty: hard
    prompt: "Напиши функцию СкомпоноватьВТаблицу(Схема, Настройки), выполняющую программную компоновку данных: построй макет компоновки из схемы и настроек через КомпоновщикМакетаКомпоновкиДанных, инициализируй ПроцессорКомпоновкиДанных макетом, выведи результат в новую таблицу значений через ПроцессорВыводаРезультатаКомпоновкиДанныхВКоллекциюЗначений и верни эту таблицу."
    reference: |
      Функция СкомпоноватьВТаблицу(Схема, Настройки)
          КомпоновщикМакета = Новый КомпоновщикМакетаКомпоновкиДанных;
          МакетКомпоновки = КомпоновщикМакета.Выполнить(Схема, Настройки);
          ПроцессорКомпоновки = Новый ПроцессорКомпоновкиДанных;
          ПроцессорКомпоновки.Инициализировать(МакетКомпоновки);
          Результат = Новый ТаблицаЗначений;
          ПроцессорВывода = Новый ПроцессорВыводаРезультатаКомпоновкиДанныхВКоллекциюЗначений;
          ПроцессорВывода.УстановитьОбъект(Результат);
          ПроцессорВывода.Вывести(ПроцессорКомпоновки);
          Возврат Результат;
      КонецФункции

  - id: func-skd-user-settings
    category: skd
    difficulty: hard
    prompt: "Напиши функцию ВосстановитьНастройки(Схема, АдресВоВременномХранилище), которая создаёт КомпоновщикНастроекКомпоновкиДанных, инициализирует его схемой и возвращает итоговые настройки. Если адрес настроек пользователя во временном хранилище непуст — попробуй загрузить их; при ошибке загрузки молча используй настройки по умолчанию (пользовательских настроек нет)."
    reference: |
      Функция ВосстановитьНастройки(Схема, АдресВоВременномХранилище)
          КомпоновщикНастроек = Новый КомпоновщикНастроекКомпоновкиДанных;
          КомпоновщикНастроек.Инициализировать(Схема);
          Если Не ПустаяСтрока(АдресВоВременномХранилище) Тогда
              Попытка
                  КомпоновщикНастроек.ЗагрузитьНастройки(АдресВоВременномХранилище);
              Исключение
                  Возврат КомпоновщикНастроек.Настройки;
              КонецПопытки;
          КонецЕсли;
          Возврат КомпоновщикНастроек.Настройки;
      КонецФункции

  - id: proc-tp-clear-and-fill
    category: tablepart
    difficulty: medium
    prompt: "Напиши процедуру ЗаполнитьТовары(Товары, Данные), которая полностью перезаполняет табличную часть: сначала очищает все строки, затем добавляет по строке на каждый элемент массива Данные (элементы — структуры), перенося совпадающие по имени свойства через ЗаполнитьЗначенияСвойств."
    reference: |
      Процедура ЗаполнитьТовары(Товары, Данные)
          Товары.Очистить();
          Для Каждого Строка Из Данные Цикл
              НоваяСтрока = Товары.Добавить();
              ЗаполнитьЗначенияСвойств(НоваяСтрока, Строка);
          КонецЦикла;
      КонецПроцедуры
    checks:
      - call: "Товары.Количество()"
        setup: "Товары = Новый ТаблицаЗначений; Товары.Колонки.Добавить(\"Номенклатура\"); Товары.Колонки.Добавить(\"Количество\"); Д = Новый Массив; Э = Новый Структура(\"Номенклатура, Количество\", \"Болт\", 2); Д.Добавить(Э); ЗаполнитьТовары(Товары, Д)"
