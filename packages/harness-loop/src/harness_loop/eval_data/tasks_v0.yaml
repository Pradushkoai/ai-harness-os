  - id: func-gcd
    category: numbers
    difficulty: medium
    prompt: "Напиши функцию НОД(Первое, Второе), возвращающую наибольший общий делитель двух неотрицательных чисел по алгоритму Евклида (итеративно, через остаток от деления)."
    reference: |
      Функция НОД(Первое, Второе)
          Пока Второе <> 0 Цикл
              Остаток = Первое % Второе;
              Первое = Второе;
              Второе = Остаток;
          КонецЦикла;
          Возврат Первое;
      КонецФункции
    checks:
      - call: "НОД(12, 18)"
        expect: "6"
      - call: "НОД(7, 13)"
        expect: "1"

  - id: func-is-prime
    category: numbers
    difficulty: medium
    prompt: "Напиши функцию ПростоееЧисло(N), возвращающую Истина, если N — простое число. Числа меньше 2 — не простые. Перебирай делители, пока их квадрат не превысит N (не используй извлечение корня)."
    reference: |
      Функция ПростоееЧисло(N)
          Если N < 2 Тогда
              Возврат Ложь;
          КонецЕсли;
          Делитель = 2;
          Пока Делитель * Делитель <= N Цикл
              Если N % Делитель = 0 Тогда
                  Возврат Ложь;
              КонецЕсли;
              Делитель = Делитель + 1;
          КонецЦикла;
          Возврат Истина;
      КонецФункции
    checks:
      - call: "ПростоееЧисло(13)"
        expect: "True"
      - call: "ПростоееЧисло(9)"
        expect: "False"
      - call: "ПростоееЧисло(1)"
        expect: "False"

  - id: func-reverse-number
    category: numbers
    difficulty: medium
    prompt: "Напиши функцию РазвернутьЧисло(Знач N), которая переставляет цифры числа в обратном порядке: 12345 превращает в 54321. Число передавай по значению, работай циклом через остаток от деления на 10."
    reference: |
      Функция РазвернутьЧисло(Знач N)
          Результат = 0;
          Пока N > 0 Цикл
              Результат = Результат * 10 + N % 10;
              N = Цел(N / 10);
          КонецЦикла;
          Возврат Результат;
      КонецФункции
    checks:
      - call: "РазвернутьЧисло(12345)"
        expect: "54321"
      - call: "РазвернутьЧисло(1000)"
        expect: "1"

  - id: func-inn-10-checksum
    category: numbers
    difficulty: hard
    prompt: "Напиши функцию КорректныйИНН(СтрокаИНН), проверяющую 10-значный ИНН по контрольной цифре. Алгоритм: возьми веса (2, 4, 10, 3, 5, 9, 4, 6, 8), посчитай сумму произведений первых 9 цифр на веса, контрольное число = остаток от деления суммы на 11 (если получилось 10 — считай 0). ИНН корректен, если контрольное число совпадает с 10-й цифрой. Строка не из 10 символов — Ложь."
    reference: |
      Функция КорректныйИНН(СтрокаИНН)
          Если СтрДлина(СтрокаИНН) <> 10 Тогда
              Возврат Ложь;
          КонецЕсли;
          Веса = СтрРазделить("2,4,10,3,5,9,4,6,8", ",");
          Сумма = 0;
          Для Номер = 1 По 9 Цикл
              Сумма = Сумма + Число(Сред(СтрокаИНН, Номер, 1)) * Число(Веса[Номер - 1]);
          КонецЦикла;
          КонтрольнаяЦифра = Сумма % 11;
          Если КонтрольнаяЦифра = 10 Тогда
              КонтрольнаяЦифра = 0;
          КонецЕсли;
          Возврат КонтрольнаяЦифра = Число(Сред(СтрокаИНН, 10, 1));
      КонецФункции
    checks:
      - call: "КорректныйИНН(\"7812304566\")"
        expect: "True"
      - call: "КорректныйИНН(\"7812304560\")"
        expect: "False"
      - call: "КорректныйИНН(\"123\")"
        expect: "False"

  - id: func-camel-to-snake
    category: string
    difficulty: hard
    prompt: "Напиши функцию ВЗмейку(Строка), переводящую идентификатор из CamelCase в snake_case: «СуммаДокумента» должна превратиться в «сумма_документа». Заглавность буквы определяй сравнением символа с его ВРег/НРег-версиями (не через коды символов), первую заглавную переводи в строчную без подчёркивания."
    reference: |
      Функция ВЗмейку(Строка)
          Результат = "";
          Для Номер = 1 По СтрДлина(Строка) Цикл
              Символ = Сред(Строка, Номер, 1);
              Заглавная = Символ = ВРег(Символ) И Символ <> НРег(Символ);
              Если Заглавная Тогда
                  Если Номер > 1 Тогда
                      Результат = Результат + "_";
                  КонецЕсли;
                  Результат = Результат + НРег(Символ);
              Иначе
                  Результат = Результат + Символ;
              КонецЕсли;
          КонецЦикла;
          Возврат Результат;
      КонецФункции
    checks:
      - call: "ВЗмейку(\"моёИмяПоля\")"
        expect: "моё_имя_поля"
      - call: "ВЗмейку(\"API\")"
        expect: "a_p_i"

