    prompt: "Напиши функцию РазобратьСтрокуCSV(Строка), которая разбивает строку с запятыми-разделителями на массив полей и обрезает пробелы по краям каждого поля (СокрЛП). Пустые поля тоже попадают в результат. Разделение — функцией СтрРазделить."
    reference: |
      Функция РазобратьСтрокуCSV(Строка)
          Поля = СтрРазделить(Строка, ",", Ложь);
          Результат = Новый Массив;
          Для Каждого Поле Из Поля Цикл
              Результат.Добавить(СокрЛП(Поле));
          КонецЦикла;
          Возврат Результат;
      КонецФункции

