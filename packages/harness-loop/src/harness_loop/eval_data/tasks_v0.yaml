    category: dates
    difficulty: hard
    prompt: "Напиши функцию ПолныхЛет(ДатаРождения, ДатаНаМомент), возвращающую сколько полных лет исполнилось человеку между этими датами. Учитывай, был ли день рождения в году ДатаНаМомент: простое деление разницы дней на 365 неверно из-за високосных годов."
    reference: |
      Функция ПолныхЛет(ДатаРождения, ДатаНаМомент)
          Возраст = Год(ДатаНаМомент) - Год(ДатаРождения);
          ДеньРожденияВЭтомГоду = Дата(Год(ДатаНаМомент), Месяц(ДатаРождения), День(ДатаРождения));
          Если ДеньРожденияВЭтомГоду > ДатаНаМомент Тогда
              Возраст = Возраст - 1;
          КонецЕсли;
          Возврат Возраст;
      КонецФункции

  - id: func-parse-date-dot
    category: dates
    difficulty: medium
    prompt: "Напиши функцию ДатаИзСтроки(Значение), которая разбирает строку вида «ГГГГ.ММ.ДД» (например «2024.03.15») и возвращает дату, построенную конструктором Дата(Год, Месяц, День). Если в строке не три части, разделённые точками, верни Неопределено."
    reference: |
      Функция ДатаИзСтроки(Значение)
          Части = СтрРазделить(Значение, ".", Ложь);
          Если Части.Количество() <> 3 Тогда
              Возврат Неопределено;
          КонецЕсли;
          Возврат Дата(Число(Части[0]), Число(Части[1]), Число(Части[2]));
      КонецФункции

  - id: map-invert
    category: collections
    difficulty: medium
    prompt: "Напиши функцию ОбратитьСоответствие(Источник), которая строит новое Соответствие по принципу «наоборот»: значения исходного соответствия становятся ключами, а ключи — значениями. При повторяющихся значениях остаётся последнее."
    reference: |
      Функция ОбратитьСоответствие(Источник)
          Результат = Новый Соответствие;
          Для Каждого Пара Из Источник Цикл
              Результат.Вставить(Пара.Значение, Пара.Ключ);
          КонецЦикла;
          Возврат Результат;
      КонецФункции

  - id: array-chunk
    category: collections
    difficulty: hard
    prompt: "Напиши функцию РазбитьМассив(Массив, РазмерКуска), которая разбивает массив на подмассивы не длиннее РазмерКуска и возвращает массив массивов. Неполный хвост тоже попадает в результат отдельным куском. Размер меньше 1 — верни пустой массив."
    reference: |
      Функция РазбитьМассив(Массив, РазмерКуска)
          Результат = Новый Массив;
          Если РазмерКуска < 1 Тогда
              Возврат Результат;
          КонецЕсли;
          Текущий = Новый Массив;
          Для Каждого Элемент Из Массив Цикл
              Текущий.Добавить(Элемент);
              Если Текущий.Количество() = РазмерКуска Тогда
                  Результат.Добавить(Текущий);
                  Текущий = Новый Массив;
              КонецЕсли;
          КонецЦикла;
          Если Текущий.Количество() > 0 Тогда
              Результат.Добавить(Текущий);
          КонецЕсли;
          Возврат Результат;
      КонецФункции

  - id: func-safe-map-get
    category: errors
    difficulty: easy
    prompt: "Напиши функцию ЗначениеСоответствия(Данные, Ключ, ЗначениеПоУмолчанию), которая возвращает значение по ключу из Соответствия, а если ключа нет (Получить вернул Неопределено) — ЗначениеПоУмолчанию."
    reference: |
      Функция ЗначениеСоответствия(Данные, Ключ, ЗначениеПоУмолчанию)
          Значение = Данные.Получить(Ключ);
          Если Значение = Неопределено Тогда
              Возврат ЗначениеПоУмолчанию;
          КонецЕсли;
          Возврат Значение;
      КонецФункции
