    prompt: "Напиши функцию СлитьСтруктуры(Базовая, Дополнительная), которая возвращает новую структуру: все ключи и значения из Базовая, плюс ключи из Дополнительная, которых в Базовая нет (существующие значения НЕ перезаписываются)."
