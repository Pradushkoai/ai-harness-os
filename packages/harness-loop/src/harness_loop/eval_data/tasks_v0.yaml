        expect: "2"

  - id: func-tp-column-sum
    category: tablepart
    difficulty: medium
    prompt: "Напиши функцию СуммаПоКолонкеТЧ(Товары, ИмяКолонки), которая обходит табличную часть (как таблицу значений) и суммирует значения указанной колонки. Если в какой-то строке значение колонки — Неопределено, эту строку пропускай. Возвращай итоговую сумму."
    reference: |
      Функция СуммаПоКолонкеТЧ(Товары, ИмяКолонки)
          Сумма = 0;
          Для Каждого Строка Из Товары Цикл
              Значение = Строка[ИмяКолонки];
              Если Значение = Неопределено Тогда
                  Продолжить;
              КонецЕсли;
              Сумма = Сумма + Значение;
          КонецЦикла;
          Возврат Сумма;
      КонецФункции
    checks:
      - call: "СуммаПоКолонкеТЧ(Товары, \"Количество\")"
        setup: "Товары = Новый ТаблицаЗначений; Товары.Колонки.Добавить(\"Количество\"); С = Товары.Добавить(); С.Количество = 3; С = Товары.Добавить(); С.Количество = 4"
        expect: "7"

  - id: func-tp-find-row
    category: tablepart
    difficulty: easy
    prompt: "Напиши функцию НайтиСтрокуТЧ(Товары, ИмяКолонки, Искомое), которая ищет в табличной части первую строку, где значение указанной колонки совпадает с искомым, и возвращает её. Если такой строки нет — верни Неопределено."
    reference: |
      Функция НайтиСтрокуТЧ(Товары, ИмяКолонки, Искомое)
          Для Каждого Строка Из Товары Цикл
              Если Строка[ИмяКолонки] = Искомое Тогда
                  Возврат Строка;
              КонецЕсли;
          КонецЦикла;
          Возврат Неопределено;
      КонецФункции
    checks:
      - call: "НайтиСтрокуТЧ(Товары, \"Номенклатура\", \"Гайка\").Количество"
        setup: "Товары = Новый ТаблицаЗначений; Товары.Колонки.Добавить(\"Номенклатура\"); Товары.Колонки.Добавить(\"Количество\"); С = Товары.Добавить(); С.Номенклатура = \"Болт\"; С.Количество = 2; С = Товары.Добавить(); С.Номенклатура = \"Гайка\"; С.Количество = 5"
