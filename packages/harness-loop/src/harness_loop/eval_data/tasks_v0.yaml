        setup: "Т = Новый ТаблицаЗначений; Т.Колонки.Добавить(\"Код\"); Т.Колонки.Добавить(\"Цена\"); С = Т.Добавить(); С.Код = 1; С.Цена = 3; С = Т.Добавить(); С.Код = 2; С.Цена = 7"
