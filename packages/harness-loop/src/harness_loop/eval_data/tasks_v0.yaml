  - id: array-chunk
    category: collections
    difficulty: hard
    prompt: "Напиши функцию РазбитьМассив(Массив, РазмерКуска), которая разбивает массив на подмассивы не длиннее РазмерКуска и возвращает массив массивов. Неполный хвост тоже попадает в результат отдельным куском. Размер меньше 1 — верни пустой массив."
    reference: |
      Функция РазбитьМассив(Массив, РазмерКуска)
          Результат = Новый Массив;
          Если РазмерКуска < 1 Тогда
              Возврат Результат;
          КонецЕсли;
          Текущий = Новый Массив;
          Для Каждого Элемент Из Массив Цикл
              Текущий.Добавить(Элемент);
              Если Текущий.Количество() = РазмерКуска Тогда
                  Результат.Добавить(Текущий);
                  Текущий = Новый Массив;
              КонецЕсли;
          КонецЦикла;
          Если Текущий.Количество() > 0 Тогда
              Результат.Добавить(Текущий);
          КонецЕсли;
          Возврат Результат;
      КонецФункции
    checks:
      - call: "РазбитьМассив(М, 2).Количество()"
        setup: "М = Новый Массив; М.Добавить(1); М.Добавить(2); М.Добавить(3)"
        expect: "2"
      - call: "РазбитьМассив(М, 2)[1].Количество()"
        setup: "М = Новый Массив; М.Добавить(1); М.Добавить(2); М.Добавить(3)"
        expect: "1"

