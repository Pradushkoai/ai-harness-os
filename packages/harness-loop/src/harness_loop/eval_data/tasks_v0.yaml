  - id: table-group-sum
    category: table
    difficulty: hard
    prompt: "Напиши функцию ИтогиПоКатегориям(Таблица), которая принимает таблицу значений с колонками «Категория» (Строка) и «Сумма» (Число), а возвращает новую таблицу с колонками «Категория» и «Сумма» — по одной строке на категорию с накопленной суммой. Накапливай промежуточные итоги в Соответствие, порядок строк не важен."
    reference: |
      Функция ИтогиПоКатегориям(Таблица)
          Накопления = Новый Соответствие;
          Для Каждого Строка Из Таблица Цикл
              Ключ = Строка.Категория;
              ТекущаяСумма = Накопления.Получить(Ключ);
              Если ТекущаяСумма = Неопределено Тогда
                  Накопления.Вставить(Ключ, Строка.Сумма);
              Иначе
                  Накопления.Вставить(Ключ, ТекущаяСумма + Строка.Сумма);
              КонецЕсли;
          КонецЦикла;

          Результат = Новый ТаблицаЗначений;
          Результат.Колонки.Добавить("Категория", Новый ОписаниеТипов("Строка"));
          Результат.Колонки.Добавить("Сумма", Новый ОписаниеТипов("Число"));
          Для Каждого Пара Из Накопления Цикл
              НоваяСтрока = Результат.Добавить();
              НоваяСтрока.Категория = Пара.Ключ;
              НоваяСтрока.Сумма = Пара.Значение;
          КонецЦикла;

          Возврат Результат;
      КонецФункции
    checks:
      - call: "ИтогиПоКатегориям(Т).Количество()"
        setup: "Т = Новый ТаблицаЗначений; Т.Колонки.Добавить(\"Категория\"); Т.Колонки.Добавить(\"Сумма\"); С = Т.Добавить(); С.Категория = \"А\"; С.Сумма = 10; С = Т.Добавить(); С.Категория = \"Б\"; С.Сумма = 20"
        expect: "2"
      - call: "ИтогиПоКатегориям(Т)[0].Сумма"
        setup: "Т = Новый ТаблицаЗначений; Т.Колонки.Добавить(\"Категория\"); Т.Колонки.Добавить(\"Сумма\"); С = Т.Добавить(); С.Категория = \"А\"; С.Сумма = 10; С = Т.Добавить(); С.Категория = \"Б\"; С.Сумма = 20"
        expect: "10"

