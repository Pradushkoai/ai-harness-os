  - id: func-full-years
    category: dates
    difficulty: hard
    prompt: "Напиши функцию ПолныхЛет(ДатаРождения, ДатаНаМомент), возвращающую сколько полных лет исполнилось человеку между этими датами. Учитывай, был ли день рождения в году ДатаНаМомент: простое деление разницы дней на 365 неверно из-за високосных годов."
    reference: |
      Функция ПолныхЛет(ДатаРождения, ДатаНаМомент)
          Возраст = Год(ДатаНаМомент) - Год(ДатаРождения);
          ДеньРожденияВЭтомГоду = Дата(Год(ДатаНаМомент), Месяц(ДатаРождения), День(ДатаРождения));
          Если ДеньРожденияВЭтомГоду > ДатаНаМомент Тогда
              Возраст = Возраст - 1;
          КонецЕсли;
          Возврат Возраст;
      КонецФункции
    checks:
      - call: "ПолныхЛет(Дата(1990, 5, 1), Дата(2024, 5, 1))"
        expect: "34"
      - call: "ПолныхЛет(Дата(1990, 5, 2), Дата(2024, 5, 1))"
        expect: "33"

