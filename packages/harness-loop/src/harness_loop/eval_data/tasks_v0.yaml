  - id: func-gcd
    category: numbers
    difficulty: medium
    prompt: "Напиши функцию НОД(Первое, Второе), возвращающую наибольший общий делитель двух неотрицательных чисел по алгоритму Евклида (итеративно, через остаток от деления)."
