  - id: table-filter-rows
    category: table
    difficulty: hard
    prompt: "Напиши функцию ОтфильтроватьПоЦене(Таблица, МинимальнаяЦена), которая возвращает НОВУЮ таблицу значений, содержащую только строки исходной таблицы, где колонка «Цена» больше или равна МинимальнаяЦена. Колонки новой таблицы должны совпадать с исходными, значения копируй целиком (удобно через ЗаполнитьЗначенияСвойств)."
    reference: |
      Функция ОтфильтроватьПоЦене(Таблица, МинимальнаяЦена)
          Результат = Новый ТаблицаЗначений;
          Для Каждого Колонка Из Таблица.Колонки Цикл
              Результат.Колонки.Добавить(Колонка.Имя);
          КонецЦикла;

          Для Каждого Строка Из Таблица Цикл
              Если Строка.Цена >= МинимальнаяЦена Тогда
                  НоваяСтрока = Результат.Добавить();
                  ЗаполнитьЗначенияСвойств(НоваяСтрока, Строка);
              КонецЕсли;
          КонецЦикла;

          Возврат Результат;
      КонецФункции
