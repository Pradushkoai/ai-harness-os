# Mini SWE-bench-BSL v0 — первый публичный набор задач для генерации BSL-кода.
#
# Семантика: resolved = цикл прошёл верификатор (и judge, если подключён).
# Reference-решения — эталон для сравнения человеком/LLM, НЕ для гейтинга
# (строковое сравнение кода бессмысленно). Задачи самодостаточные: не требуют
# конфигурации 1С, только синтаксически корректный модуль.
#
# Рост набора: v0.2 = 30 задач (было 10). Новые категории: dates, collections,
# query; добавлены hard-задачи (фибоначчи, календарная арифметика, частоты).
# Каждое reference-решение прогоняется через реальный bsl-language-server
# (интеграционный тест test_integration.py) — 0 Error-диагностик.
#
# id — стабильные идентификаторы (не переименовывать после публикации).
version: 1
tasks:
  - id: func-sum-two-numbers
    category: function
    difficulty: easy
    prompt: "Напиши функцию СуммаДвухЧисел(А, Б), которая принимает два числа и возвращает их сумму."
    reference: |
      Функция СуммаДвухЧисел(А, Б)
          Возврат А + Б;
      КонецФункции

  - id: func-max-of-two
    category: branching
    difficulty: easy
    prompt: "Напиши функцию МаксимумИзДвух(А, Б), которая возвращает большее из двух чисел."
    reference: |
      Функция МаксимумИзДвух(А, Б)
          Если А > Б Тогда
              Возврат А;
          КонецЕсли;
          Возврат Б;
      КонецФункции

  - id: func-is-blank-string
    category: function
    difficulty: easy
    prompt: "Напиши функцию ПустаяСтрока(Знач Строка), которая возвращает Истина, если строка пустая или состоит только из пробелов."
    reference: |
      Функция ПустаяСтрока(Знач Строка)
          Возврат СокрЛП(Строка) = "";
      КонецФункции

  - id: func-array-sum
    category: loop
    difficulty: medium
    prompt: "Напиши функцию СуммаМассива(Массив), которая принимает массив чисел и возвращает сумму элементов. Для пустого массива верни 0."
    reference: |
      Функция СуммаМассива(Массив)
          Сумма = 0;
          Для Каждого Элемент Из Массив Цикл
              Сумма = Сумма + Элемент;
          КонецЦикла;
          Возврат Сумма;
      КонецФункции

  - id: func-discount
    category: branching
    difficulty: medium
    prompt: "Напиши функцию РассчитатьСкидку(Сумма, ПроцентСкидки), которая возвращает сумму с применённой скидкой. Если ПроцентСкидки меньше или равен 0, верни исходную сумму без изменений."
    reference: |
      Функция РассчитатьСкидку(Сумма, ПроцентСкидки)
          Если ПроцентСкидки <= 0 Тогда
              Возврат Сумма;
          КонецЕсли;
          Возврат Сумма * (100 - ПроцентСкидки) / 100;
      КонецФункции

  - id: proc-numbers-1-to-10
    category: loop
    difficulty: easy
    prompt: "Напиши процедуру ВывестиЧислаОт1До10(), которая выводит числа от 1 до 10, каждое с новой строки, используя метод Сообщить()."
    reference: |
      Процедура ВывестиЧислаОт1До10()
          Для Номер = 1 По 10 Цикл
              Сообщить(Строка(Номер));
          КонецЦикла;
      КонецПроцедуры

  - id: proc-safe-division
    category: errors
    difficulty: medium
    prompt: "Напиши процедуру РазделитьЧисла(А, Б), которая делит А на Б и выводит результат методом Сообщить(). При делении на ноль перехвати ошибку и выведи сообщение «Деление на ноль», не допуская падения."
    reference: |
      Процедура РазделитьЧисла(А, Б)
          Попытка
              Результат = А / Б;
              Сообщить(Строка(Результат));
          Исключение
              Сообщить("Деление на ноль");
          КонецПопытки;
      КонецПроцедуры

  - id: func-phone-digits
    category: string
    difficulty: medium
    prompt: "Напиши функцию ТолькоЦифры(Строка), которая удаляет из строки все символы, кроме цифр, и возвращает результат."
    reference: |
      Функция ТолькоЦифры(Строка)
          Результат = "";
          Для Номер = 1 По СтрДлина(Строка) Цикл
              Символ = Сред(Строка, Номер, 1);
              Если Найти("0123456789", Символ) > 0 Тогда
                  Результат = Результат + Символ;
              КонецЕсли;
          КонецЦикла;
          Возврат Результат;
      КонецФункции

  - id: func-percent-default
    category: function
    difficulty: easy
    prompt: "Напиши функцию ПроцентОтЧисла(Число, Процент = 100), которая возвращает указанный процент от числа. Параметр Процент необязательный, по умолчанию 100."
    reference: |
      Функция ПроцентОтЧисла(Число, Процент = 100)
          Возврат Число * Процент / 100;
      КонецФункции

  - id: proc-fill-structure
    category: structure
    difficulty: medium
    prompt: "Напиши процедуру ЗаполнитьДатуВСтруктуре(Структура), которая добавляет в переданную структуру ключ «Дата» с текущей датой сеанса, если такого ключа ещё нет."
    reference: |
      Процедура ЗаполнитьДатуВСтруктуре(Структура)
          Если Не Структура.Свойство("Дата") Тогда
              Структура.Вставить("Дата", ТекущаяДатаСеанса());
          КонецЕсли;
      КонецПроцедуры

  # --- v0.2: рост набора 10 -> 30 ---------------------------------------

  - id: func-clamp
    category: function
    difficulty: medium
    prompt: "Напиши функцию ОграничитьЧисло(Значение, Минимум, Максимум), которая возвращает Значение, но не меньше Минимума и не больше Максимума."
    reference: |
      Функция ОграничитьЧисло(Значение, Минимум, Максимум)
          Если Значение < Минимум Тогда
              Возврат Минимум;
          КонецЕсли;
          Если Значение > Максимум Тогда
              Возврат Максимум;
          КонецЕсли;
          Возврат Значение;
      КонецФункции

  - id: func-factorial
    category: loop
    difficulty: medium
    prompt: "Напиши функцию Факториал(N), возвращающую факториал натурального числа N. Для N меньше 0 верни 0, для 0 верни 1."
    reference: |
      Функция Факториал(N)
          Если N < 0 Тогда
              Возврат 0;
          КонецЕсли;
          Результат = 1;
          Для Номер = 1 По N Цикл
              Результат = Результат * Номер;
          КонецЦикла;
          Возврат Результат;
      КонецФункции

  - id: func-fibonacci
    category: loop
    difficulty: hard
    prompt: "Напиши функцию Фибоначчи(N), возвращающую N-е число Фибоначчи (F(0)=0, F(1)=1, F(N)=F(N-1)+F(N-2)). Используй итеративный подход без рекурсии."
    reference: |
      Функция Фибоначчи(N)
          Если N <= 0 Тогда
              Возврат 0;
          КонецЕсли;
          Если N = 1 Тогда
              Возврат 1;
          КонецЕсли;
          Предыдущее = 0;
          Текущее = 1;
          Для Номер = 2 По N Цикл
              Следующее = Предыдущее + Текущее;
              Предыдущее = Текущее;
              Текущее = Следующее;
          КонецЦикла;
          Возврат Текущее;
      КонецФункции

  - id: func-max-in-array
    category: loop
    difficulty: medium
    prompt: "Напиши функцию МаксимумМассива(Массив), возвращающую наибольший элемент массива чисел. Для пустого массива верни Неопределено."
    reference: |
      Функция МаксимумМассива(Массив)
          Если Массив.Количество() = 0 Тогда
              Возврат Неопределено;
          КонецЕсли;
          Максимум = Массив[0];
          Для Каждого Элемент Из Массив Цикл
              Если Элемент > Максимум Тогда
                  Максимум = Элемент;
              КонецЕсли;
          КонецЦикла;
          Возврат Максимум;
      КонецФункции

  - id: func-reverse-string
    category: string
    difficulty: medium
    prompt: "Напиши функцию РазвернутьСтроку(Строка), возвращающую строку с символами в обратном порядке. Учитывай, что в BSL цикл «Для ... По ...» работает только по возрастанию."
    reference: |
      Функция РазвернутьСтроку(Строка)
          Результат = "";
          Длина = СтрДлина(Строка);
          Для Номер = 1 По Длина Цикл
              Результат = Сред(Строка, Номер, 1) + Результат;
          КонецЦикла;
          Возврат Результат;
      КонецФункции

  - id: func-count-char
    category: string
    difficulty: easy
    prompt: "Напиши функцию КоличествоВхождений(Строка, Символ), возвращающую, сколько раз заданный символ встречается в строке."
    reference: |
      Функция КоличествоВхождений(Строка, Символ)
          Счетчик = 0;
          Для Номер = 1 По СтрДлина(Строка) Цикл
              Если Сред(Строка, Номер, 1) = Символ Тогда
                  Счетчик = Счетчик + 1;
              КонецЕсли;
          КонецЦикла;
          Возврат Счетчик;
      КонецФункции

  - id: func-capitalize
    category: string
    difficulty: medium
    prompt: "Напиши функцию ПерваяЗаглавная(Строка), которая делает первую букву строки заглавной, а остальные — строчными. Пустую строку верни как есть."
    reference: |
      Функция ПерваяЗаглавная(Строка)
          Если СтрДлина(Строка) = 0 Тогда
              Возврат Строка;
          КонецЕсли;
          Возврат ВРег(Сред(Строка, 1, 1)) + НРег(Сред(Строка, 2));
      КонецФункции

  - id: func-is-palindrome
    category: string
    difficulty: medium
    prompt: "Напиши функцию Палиндром(Строка), возвращающую Истина, если строка читается одинаково в обе стороны. Пробелы при сравнении игнорируй."
    reference: |
      Функция Палиндром(Строка)
          СтрокаБезПробелов = СтрЗаменить(Строка, " ", "");
          Длина = СтрДлина(СтрокаБезПробелов);
          Для Номер = 1 По Цел(Длина / 2) Цикл
              Если Сред(СтрокаБезПробелов, Номер, 1)
                  <> Сред(СтрокаБезПробелов, Длина - Номер + 1, 1) Тогда
                  Возврат Ложь;
              КонецЕсли;
          КонецЦикла;
          Возврат Истина;
      КонецФункции

  - id: func-reverse-words
    category: string
    difficulty: medium
    prompt: "Напиши функцию РазвернутьСлова(Строка), меняющую порядок слов в строке на обратный (слова разделены пробелами). Подряд идущие пробелы схлопни в один."
    reference: |
      Функция РазвернутьСлова(Строка)
          Слова = СтрРазделить(Строка, " ", Ложь);
          Результат = Новый Массив;
          Для Каждого Слово Из Слова Цикл
              Если СтрДлина(Слово) > 0 Тогда
                  Результат.Вставить(0, Слово);
              КонецЕсли;
          КонецЦикла;
          Возврат СтрСоединить(Результат, " ");
      КонецФункции

  - id: func-string-template
    category: string
    difficulty: easy
    prompt: "Напиши функцию Приветствие(Имя, Возраст), возвращающую строку вида «Привет, Имя! Тебе Возраст.» — собери её функцией СтрШаблон."
    reference: |
      Функция Приветствие(Имя, Возраст)
          Возврат СтрШаблон("Привет, %1! Тебе %2.", Имя, Возраст);
      КонецФункции

  - id: func-safe-parse-number
    category: errors
    difficulty: medium
    prompt: "Напиши функцию БезопасноеЧисло(Строка), которая пытается преобразовать строку в число функцией Число(). Если строка не число — перехвати исключение и верни 0."
    reference: |
      Функция БезопасноеЧисло(Строка)
          Попытка
              Возврат Число(Строка);
          Исключение
              Возврат 0;
          КонецПопытки;
      КонецФункции

  - id: func-date-diff-days
    category: dates
    difficulty: medium
    prompt: "Напиши функцию РазницаДней(ДатаНачала, ДатаОкончания), возвращающую количество полных дней между двумя датами. Учитывай, что разность дат в BSL даёт секунды."
    reference: |
      Функция РазницаДней(ДатаНачала, ДатаОкончания)
          РазностьСекунд = ДатаОкончания - ДатаНачала;
          Возврат Цел(РазностьСекунд / 86400);
      КонецФункции

  - id: func-leap-year
    category: dates
    difficulty: medium
    prompt: "Напиши функцию ВисокосныйГод(Год), возвращающую Истина для високосного года: год делится на 400 — високосный; на 100 — нет; иначе на 4 — високосный."
    reference: |
      Функция ВисокосныйГод(Год)
          Если Год % 400 = 0 Тогда
              Возврат Истина;
          КонецЕсли;
          Если Год % 100 = 0 Тогда
              Возврат Ложь;
          КонецЕсли;
          Возврат Год % 4 = 0;
      КонецФункции

  - id: func-add-months
    category: dates
    difficulty: hard
    prompt: "Напиши функцию ДобавитьМесяцы(Дата, КоличествоМесяцев), прибавляющую к дате заданное число месяцев (может быть отрицательным). Если дня в новом месяце нет (31 января + 1 месяц), обрежь до последнего дня месяца. Не используй встроенную ДобавитьМесяц()."
    reference: |
      Функция ДобавитьМесяцы(Дата, КоличествоМесяцев)
          ГодДаты = Год(Дата);
          МесяцДаты = Месяц(Дата);
          ДеньДаты = День(Дата);
          ВсегоМесяцев = ГодДаты * 12 + (МесяцДаты - 1) + КоличествоМесяцев;
          НовыйГод = Цел(ВсегоМесяцев / 12);
          НовыйМесяц = ВсегоМесяцев % 12 + 1;
          ДнейВМесяце = День(КонецМесяца(Дата(НовыйГод, НовыйМесяц, 1)));
          Если ДеньДаты > ДнейВМесяце Тогда
              ДеньДаты = ДнейВМесяце;
          КонецЕсли;
          Возврат Дата(НовыйГод, НовыйМесяц, ДеньДаты);
      КонецФункции

  - id: func-element-frequencies
    category: collections
    difficulty: hard
    prompt: "Напиши функцию ЧастотыЭлементов(Массив), возвращающую Соответствие «элемент -> сколько раз он встретился в массиве»."
    reference: |
      Функция ЧастотыЭлементов(Массив)
          Результат = Новый Соответствие;
          Для Каждого Элемент Из Массив Цикл
              ТекущееКоличество = Результат.Получить(Элемент);
              Если ТекущееКоличество = Неопределено Тогда
                  Результат.Вставить(Элемент, 1);
              Иначе
                  Результат.Вставить(Элемент, ТекущееКоличество + 1);
              КонецЕсли;
          КонецЦикла;
          Возврат Результат;
      КонецФункции

  - id: func-unique-array
    category: collections
    difficulty: medium
    prompt: "Напиши функцию УникальныеЭлементы(Массив), возвращающую новый массив без повторов, сохраняя порядок первого вхождения."
    reference: |
      Функция УникальныеЭлементы(Массив)
          Результат = Новый Массив;
          Для Каждого Элемент Из Массив Цикл
              Если Результат.Найти(Элемент) = Неопределено Тогда
                  Результат.Добавить(Элемент);
              КонецЕсли;
          КонецЦикла;
          Возврат Результат;
      КонецФункции

  - id: proc-print-mapping
    category: collections
    difficulty: easy
    prompt: "Напиши процедуру ВывестиСоответствие(Данные), которая выводит каждую пару «ключ: значение» из соответствия отдельной строкой методом Сообщить()."
    reference: |
      Процедура ВывестиСоответствие(Данные)
          Для Каждого Пара Из Данные Цикл
              Сообщить(Строка(Пара.Ключ) + ": " + Строка(Пара.Значение));
          КонецЦикла;
      КонецПроцедуры

  - id: struct-nested-defaults
    category: structure
    difficulty: medium
    prompt: "Напиши функцию НастройкиПоУмолчанию(), создающую и возвращающую структуру с ключами «ИспользоватьСкидки» (Истина) и «Скидка» (10), плюс вложенную структуру «Применение» с ключом «Приоритет» (1)."
    reference: |
      Функция НастройкиПоУмолчанию()
          Настройки = Новый Структура;
          Настройки.Вставить("ИспользоватьСкидки", Истина);
          Настройки.Вставить("Скидка", 10);
          Применение = Новый Структура;
          Применение.Вставить("Приоритет", 1);
          Настройки.Вставить("Применение", Применение);
          Возврат Настройки;
      КонецФункции

  - id: query-nomenclature-select
    category: query
    difficulty: medium
    prompt: "Напиши функцию ТекстЗапросаНоменклатура(), возвращающую текст запроса: выбрать Ссылка и Наименование из справочника Номенклатура, где ПометкаУдаления равна Ложь. Запрос собери через Новый Запрос и верни его Текст."
    reference: |
      Функция ТекстЗапросаНоменклатура()
          Запрос = Новый Запрос;
          Запрос.Текст =
          "ВЫБРАТЬ
          |    Номенклатура.Ссылка КАК Ссылка,
          |    Номенклатура.Наименование КАК Наименование
          |ИЗ
          |    Справочник.Номенклатура КАК Номенклатура
          |ГДЕ
          |    Номенклатура.ПометкаУдаления = ЛОЖЬ";
          Возврат Запрос.Текст;
      КонецФункции

  - id: query-doc-period
    category: query
    difficulty: hard
    prompt: "Напиши функцию ЗапросПоПериоду(ДатаНачала, ДатаОкончания), создающую запрос к документу РеализацияТоваровУслуг с отбором по полю Дата между параметрами &ДатаНачала и &ДатаОкончания. Параметры установи методом УстановитьПараметр, верни готовый объект Запрос."
    reference: |
      Функция ЗапросПоПериоду(ДатаНачала, ДатаОкончания)
          Запрос = Новый Запрос;
          Запрос.Текст =
          "ВЫБРАТЬ
          |    Реализация.Ссылка КАК Ссылка,
          |    Реализация.Дата КАК Дата
          |ИЗ
