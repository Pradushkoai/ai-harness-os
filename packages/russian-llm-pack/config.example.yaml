# Пример конфигурации RLP.
# Положи как ./rlp.config.yaml (или укажи путь в $RLP_CONFIG).
# СЕКРЕТОВ ЗДЕСЬ НЕТ И НЕ ДОЛЖНО БЫТЬ — только имена env-переменных.

providers:
  deepseek:
    api_key_env: DEEPSEEK_API_KEY          # default, можно не указывать
    # base_url: https://api.deepseek.com   # override при необходимости

  zai:
    api_key_env: ZAI_API_KEY
    # base_url: https://api.z.ai/api/paas/v4          # международный
    # base_url: https://open.bigmodel.cn/api/paas/v4  # mainland-альтернатива
    # default_model: glm-4.6

  gigachat:
    api_key_env: GIGACHAT_AUTH_KEY          # OAuth Basic key (v0.2, адаптер сам получает токен)
    # api_key_env: GIGACHAT_ACCESS_TOKEN     # альтернатива: готовый токен (без refresh)
    # scope_env: GIGACHAT_SCOPE              # default GIGACHAT_API_PERS
    # oauth_url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
    # default_model: GigaChat-Pro
    # TLS: GIGACHAT_CA_BUNDLE=/path/ca.pem или GIGACHAT_ALLOW_INSECURE=1

  yandexgpt:
    api_key_env: YANDEXGPT_API_KEY           # Api-Key (предпочтительно)
    # iam_token_env: YANDEXGPT_IAM_TOKEN     # Bearer IAM-токен (~12ч, без refresh)
    # folder_id_env: YANDEXGPT_FOLDER_ID     # ОБЯЗАТЕЛЕН: modelUri = gpt://<folder>/<model>
    # base_url: https://llm.api.cloud.yandex.net/foundationModels/v1

routing:
  tasks:
    # цепочка = порядок fallback; провайдеры без ключей пропускаются
    # yandexgpt замыкает каждую цепь: только Яндекс-аккаунт — уже рабочий setup
    coding:      [deepseek/deepseek-chat, zai/glm-4.6, gigachat/GigaChat-Pro, yandexgpt/yandexgpt]
    reasoning:   [deepseek/deepseek-reasoner, zai/glm-4.6, yandexgpt/yandexgpt]
    cheap:       [zai/glm-4.5-air, deepseek/deepseek-chat, gigachat/GigaChat-Lite, yandexgpt/yandexgpt-lite]
    judge:       [zai/glm-4.6, deepseek/deepseek-chat, yandexgpt/yandexgpt-pro]   # судья ≠ модель-кодер

  params:
    coding:    {temperature: 0.2}
    reasoning: {}
    cheap:     {temperature: 0.3}
    judge:     {temperature: 0.0}

defaults:
  task: coding
  retries: 2        # повтора на transient-ошибку (429/5xx/timeout)
  timeout_s: 60
